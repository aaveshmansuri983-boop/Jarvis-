name: Build Jarvis Zero APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          JARVIS_OWNER_EMAIL: ${{ secrets.JARVIS_OWNER_GMAIL }}
        run: gradle --no-daemon assembleDebug

      - name: Print Android OAuth SHA-1 fingerprint
        run: gradle --no-daemon signingReport

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Zero-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
