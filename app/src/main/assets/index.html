<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#102c48 0,#07111f 48%,#030811 100%);color:#eaf7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.shell{max-width:620px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}header{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1d3a50}.brand{display:flex;align-items:center;gap:12px}.brand b{letter-spacing:3px;font-size:17px}.brand small{display:block;color:#6e9bb8;font-size:9px;letter-spacing:2px;margin-top:3px}.dot{width:10px;height:10px;border-radius:50%;background:#3ce6ff;box-shadow:0 0 15px #3ce6ff}#status{font-size:10px;color:#69dff3;letter-spacing:2px}.hero{text-align:center;padding:25px 0 15px}.orb{width:150px;height:150px;margin:0 auto 12px;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#123e5c 0,#0b2035 55%,#07111f 70%);box-shadow:0 0 35px #0b789b55,inset 0 0 22px #42dfff44;border:1px solid #45cbe966}.orb:before,.orb:after{content:"";position:absolute;inset:8px;border:1px solid #41dfff88;border-radius:50%;animation:spin 9s linear infinite}.orb:after{inset:-7px;border-color:#41dfff33;border-style:dashed;animation-direction:reverse;animation-duration:18s}.orb i{position:absolute;width:7px;height:7px;background:#7af4ff;border-radius:50%;box-shadow:0 0 12px #7af4ff}.orb i:nth-of-type(1){top:12px;left:40px}.orb i:nth-of-type(2){right:12px;top:70px}.orb i:nth-of-type(3){bottom:18px;left:38px}.core{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9ffff,#4de8ff 20%,#08769d 65%,#06233b);box-shadow:0 0 28px #32dfff;animation:pulse 2s infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 45px #32dfff}}h1{font-size:23px;margin:10px 0 4px}p{color:#9bb8ca;margin:0 0 17px;font-size:14px}.mic{border:1px solid #37d7f3;background:linear-gradient(120deg,#0c5776,#103a5c);color:white;border-radius:30px;padding:13px 24px;font-weight:650;font-size:15px;box-shadow:0 0 22px #12b9df33}.mic.listening{background:#7b2435;border-color:#ff8396}.mic span{margin-right:8px}.tiny{font-size:10px;color:#66869b;margin-top:9px}.chat{flex:1;min-height:150px;max-height:34vh;overflow:auto;padding:8px 2px}.msg{padding:11px 14px;border-radius:15px;margin:8px 0;max-width:88%;font-size:14px;line-height:1.45;white-space:pre-wrap}.bot{background:#102b40;border:1px solid #1e506b;color:#d9f4ff;border-bottom-left-radius:4px}.user{background:#164c68;margin-left:auto;border:1px solid #287a9c;border-bottom-right-radius:4px}.composer{display:flex;gap:9px;padding:12px 0}.composer input{flex:1;min-width:0;border:1px solid #24475e;background:#091a2a;color:white;border-radius:14px;padding:14px;font-size:14px;outline:none}.composer button{width:50px;border:0;border-radius:14px;background:#22bcd8;color:#04121e;font-size:22px}.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:5px 0 18px}.quick button{border:1px solid #24485e;background:#0b2032;color:#b9eaff;padding:9px 12px;border-radius:22px;font-size:12px}footer{text-align:center;color:#45677e;font-size:9px;letter-spacing:1.5px;padding:12px 0 18px}@media(min-height:850px){.hero{padding-top:42px}.orb{width:170px;height:170px}}


/* Anime hologram avatar */
.avatar-stage{width:min(78vw,310px);height:300px;margin:0 auto 8px;position:relative;display:grid;place-items:center;isolation:isolate}
.avatar-ring{position:absolute;width:260px;height:260px;border:1px solid #39dff477;border-radius:50%;box-shadow:0 0 34px #20c9f655,inset 0 0 25px #20c9f622;animation:orbit 14s linear infinite}
.avatar-ring:before,.avatar-ring:after{content:"";position:absolute;inset:12px;border:1px dashed #5deaff55;border-radius:50%}
.avatar-ring:after{inset:-9px;border-color:#5deaff33}
@keyframes orbit{to{transform:rotate(360deg)}}
.anime-avatar{width:260px;height:310px;position:relative;z-index:1;filter:drop-shadow(0 0 22px #21cfff88) saturate(1.18);animation:avatarFloat 3.6s ease-in-out infinite}
@keyframes avatarFloat{50%{transform:translateY(-6px)}}
.anime-avatar .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
.anime-avatar .mouth{transform-box:fill-box;transform-origin:center;transition:all .12s}
.anime-avatar.speaking .mouth{animation:talk .22s infinite alternate}
@keyframes talk{to{transform:scaleY(2.8)}}
.avatar-spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#7df6ff;box-shadow:0 0 14px #7df6ff}
.avatar-spark.one{top:45px;left:24px}.avatar-spark.two{right:20px;top:100px}.avatar-spark.three{bottom:25px;left:55px}

</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><span class="dot"></span><div><b>J.A.R.V.I.S</b><small>PERSONAL AI • ZERO COST</small></div></div><span id="status">READY</span></header>
<main>
<section class="hero"><div class="avatar-stage"><div class="avatar-ring"></div><span class="avatar-spark one"></span><span class="avatar-spark two"></span><span class="avatar-spark three"></span><svg id="jarvisAvatar" class="anime-avatar" viewBox="0 0 260 310" role="img" aria-label="3D anime Jarvis hologram character">
<defs>
 <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2ffff"/><stop offset=".28" stop-color="#65edff"/><stop offset=".72" stop-color="#159bc9"/><stop offset="1" stop-color="#064b78"/></linearGradient>

<path d="M77 94 Q99 62 117 47 Q111 79 98 104 Q128 87 143 56 Q157 83 183 92 L190 126 Q178 110 165 110 Q146 126 129 112 Q107 127 83 112Z" fill="#d7fbff" opacity=".92"/>

<path d="M142 133 Q155 124 169 133" fill="none" stroke="#245b78" stroke-width="4" stroke-linecap="round"/>

<ellipse class="eye" cx="155" cy="145" rx="9" ry="12" fill="#087eae" filter="url(#softGlow)"/>

</svg></div><h1>नमस्ते, मैं Jarvis हूँ</h1><p id="hint">मुझसे बोलकर या लिखकर बात करें</p><button id="listen" class="mic"><span>🎙</span> बोलना शुरू करें</button><div style="height:10px"></div><button id="wake" class="mic" style="background:linear-gradient(120deg,#174b38,#123c35);border-color:#54d69b"><span>🟢</span> Hey Jarvis मोड बंद है</button><div class="tiny">ऐप खुला रहने पर “Hey Jarvis” बोलकर जगाएँ। स्क्रीन लॉक/ऐप बंद होने पर wake word की गारंटी नहीं।</div></section>
<section class="chat" id="chat"><div class="msg bot">नमस्ते! मैं तैयार हूँ। कहिए, क्या करना है?</div></section>
<div class="composer"><input id="input" placeholder="यहाँ अपना आदेश लिखें…" autocomplete="off"><button id="send">➤</button></div>
<section class="quick"><button data-cmd="अभी कितने बजे हैं?">🕒 समय</button><button data-cmd="आज की तारीख बताओ">📅 तारीख</button><button data-cmd="मौसम बताओ">🌤 मौसम</button><button data-cmd="यूट्यूब खोलो">▶ YouTube</button><button data-cmd="गूगल खोलो">🔎 Google</button></section>
</main><footer>JARVIS ZERO • कोई API key या subscription नहीं</footer>
</div><script>
const $=s=>document.querySelector(s), chat=$('#chat'), input=$('#input'), status=$('#status'), listen=$('#listen');
function say(text){try{const face=$('#jarvisAvatar');if(face)face.classList.add('speaking');if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';u.rate=1;u.onend=()=>face&&face.classList.remove('speaking');u.onerror=()=>face&&face.classList.remove('speaking');speechSynthesis.speak(u)}catch(e){const face=$('#jarvisAvatar');if(face)face.classList.remove('speaking')}}
function add(text,who='bot'){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function openUrl(url){window.location.href=url}
function askConfirm(text, yes){add(text+'\nभेजने/करने से पहले पुष्टि करें।','bot');const row=document.createElement('div');row.className='quick';const b=document.createElement('button');b.textContent='हाँ, आगे बढ़ो';b.onclick=()=>{yes();row.remove()};const c=document.createElement('button');c.textContent='रद्द';c.onclick=()=>{add('ठीक है, रद्द कर दिया।');row.remove()};row.append(b,c);chat.appendChild(row)}
function answer(raw){const q=raw.trim(),l=q.toLowerCase();let a='मैं अभी बिना paid API वाला बेसिक Jarvis हूँ। इस आदेश को सीधे पूरा करने की सुविधा अभी उपलब्ध नहीं है।';
if(/समय|कितने बजे|time/.test(l))a='अभी समय है '+new Date().toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'});
else if(/तारीख|दिनांक|date|आज कौन/.test(l))a='आज '+new Date().toLocaleDateString('hi-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' है।';
else if(/नमस्ते|हेलो|hello|hi\b/.test(l))a='नमस्ते! मैं आपकी मदद के लिए तैयार हूँ।';
else if(/तुम कौन|तुम्हारा नाम|who are you/.test(l))a='मैं Jarvis Zero हूँ, आपका मुफ्त निजी सहायक।';
else if(/कॉल|call/.test(l)){const m=q.match(/(?:कॉल|call)\s+(?:करो|लगाओ)?\s*(.*)/i);const target=(m&&m[1]||'').trim();if(/\d{6,}/.test(target)){const n=target.replace(/\D/g,'');askConfirm('फोन डायलर में '+n+' खोलूँ?',()=>openUrl('tel:'+n));return}else{a='किस नंबर पर कॉल करनी है? नंबर लिखें या बोलें।';}}
else if(/व्हाट्सएप|whatsapp/.test(l)){const m=q.match(/(?:मैसेज|message)\s+(?:भेजो|करो)?\s*(.*)/i);const rest=(m&&m[1]||'').trim();const num=rest.match(/\+?\d{10,13}/);const msgMatch=q.match(/(?:कि|message|मैसेज)\s+(.+)$/i);if(num){const phone=num[0].replace(/\D/g,'');const msg=msgMatch?msgMatch[1]:'';askConfirm('WhatsApp chat खोलूँ? संदेश: '+(msg||'खाली संदेश'),()=>openUrl('https://wa.me/'+phone+(msg?'?text='+encodeURIComponent(msg):'')));return}else{a='WhatsApp खोल रहा हूँ। संदेश भेजने के लिए चैट चुनें।';openUrl('https://wa.me/');}}
else if(/इंस्टाग्राम|instagram|रील|reel/.test(l)){a='Instagram खोल रहा हूँ। Reels स्क्रॉल करने के लिए ऐप में swipe करना होगा।';openUrl('https://www.instagram.com/reels/');}
else if(/यूट्यूब|youtube/.test(l)){a='YouTube खोल रहा हूँ।';openUrl('https://www.youtube.com');}
else if(/गूगल|google|खोजो|सर्च|search/.test(l)){let term=q.replace(/गूगल|google|पर खोजो|खोजो|सर्च करो|सर्च|search/g,'').trim();a='Google पर खोज रहा हूँ।';openUrl('https://www.google.com/search?q='+encodeURIComponent(term||'Google'));}
else if(/मौसम|weather/.test(l)){a='मौसम की ताज़ा जानकारी खोज रहा हूँ।';openUrl('https://www.google.com/search?q='+encodeURIComponent('मौसम अभी'));}
else if(/मदद|help|क्या कर/.test(l))a='आप समय, तारीख पूछ सकते हैं; Google, YouTube, Instagram खोल सकते हैं; नंबर देकर डायलर खोल सकते हैं; और WhatsApp chat लिंक खोल सकते हैं।';
add(a);say(a)}
function send(t=input.value){t=t.trim();if(!t)return;add(t,'user');input.value='';answer(t)}
$('#send').onclick=()=>send();input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>send(b.dataset.cmd));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,wakeEnabled=false,manual=false,restartTimer=null;
function wakeUI(){const b=$('#wake');b.textContent=wakeEnabled?'🟢 Hey Jarvis मोड चालू है':'🟢 Hey Jarvis मोड बंद है';status.textContent=wakeEnabled?'WAKE WORD ON':'READY'}
function startRec(){if(!rec)return;try{rec.start()}catch(e){}}
if(SR){rec=new SR();rec.lang='hi-IN';rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=true;rec.onstart=()=>{if(manual){listen.classList.add('listening');listen.textContent='🎙 सुन रहा हूँ…'};status.textContent=wakeEnabled?'WAKE WORD ON':'LISTENING'};rec.onend=()=>{listen.classList.remove('listening');listen.innerHTML='🎙 बोलना शुरू करें';if(wakeEnabled){clearTimeout(restartTimer);restartTimer=setTimeout(startRec,800)}else status.textContent='READY'};rec.onerror=()=>{if(!wakeEnabled)add('माइक्रोफोन अनुमति दें या Chrome में खोलकर देखें।')};rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;const t=e.results[i][0].transcript.trim();if(wakeEnabled){if(/hey\s*jarvis|हे\s*जार्विस|ए\s*जार्विस/i.test(t)){const cmd=t.replace(/hey\s*jarvis|हे\s*जार्विस|ए\s*जार्विस/ig,'').trim();say('जी, बताइए');if(cmd){input.value=cmd;send()}else add('जी, मैं सुन रहा हूँ। अपना आदेश बताइए।')}}else{input.value=t;send()}}};listen.onclick=()=>{manual=true;startRec()};$('#wake').onclick=()=>{wakeEnabled=!wakeEnabled;wakeUI();if(wakeEnabled){manual=false;startRec();add('Hey Jarvis मोड चालू। ऐप खुला रखें और Hey Jarvis बोलें।')}else{try{rec.stop()}catch(e){}add('Wake word बंद।')}};}else{listen.onclick=()=>add('इस ब्राउज़र में voice recognition नहीं है। Android Chrome आज़माएँ।');$('#wake').onclick=()=>add('Wake word के लिए SpeechRecognition support वाला browser चाहिए।')}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
