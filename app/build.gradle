plugins { id 'com.android.application' }

android {
    namespace 'com.jarvis.zero'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jarvis.zero'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.1'
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${System.getenv('GOOGLE_WEB_CLIENT_ID') ?: ''}\""
        buildConfigField "String", "OWNER_EMAIL", "\"${System.getenv('JARVIS_OWNER_EMAIL') ?: ''}\""
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
